
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>{{ station_name }}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #1d2635;
            color: white;
            overflow: hidden;
        }

        .container {
            width: 100%;
            padding: 12px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .station {
            font-size: clamp(14px, 3vw, 22px);
            font-weight: 600;
            min-width: 0;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        select {
            max-width: 150px;
            min-width: 0;
            padding: 5px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            background: #29364a;
            color: white;
            font-size: 11px;
        }

        .direction {
            font-size: clamp(10px, 2vw, 14px);
            opacity: 0.65;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .trains {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 8px;
            width: 100%;
        }

        .train {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 6px;
            text-align: center;
            min-width: 0;
        }

        .route {
            font-size: clamp(20px, 5vw, 32px);
            font-weight: bold;
            line-height: 1;
            margin-bottom: 6px;
        }

        .arrival {
            font-size: clamp(13px, 3vw, 19px);
            font-weight: 500;
            white-space: nowrap;
        }

        .empty {
            text-align: center;
            padding: 12px;
            font-size: clamp(12px, 3vw, 16px);
            opacity: 0.65;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="station">
                {{ station_name }}
            </div>

            <div class="controls">
                <select id="station-select" aria-label="Select station">
                    {% for station in stations %}
                        <option
                            value="{{ station.station_id }}"
                            {% if station.station_id == station_id %}selected{% endif %}
                        >
                            {{ station.name }}
                        </option>
                    {% endfor %}
                </select>

                <select id="direction-select" aria-label="Select direction">
                    <option
                        value="northbound"
                        {% if direction == "northbound" %}selected{% endif %}
                    >
                        North
                    </option>
                    <option
                        value="southbound"
                        {% if direction == "southbound" %}selected{% endif %}
                    >
                        South
                    </option>
                </select>
            </div>
        </div>

        <div class="trains" id="trains">
            {% if trains %}
                {% for train in trains %}
                    <div class="train">
                        <div class="route">{{ train.route }}</div>
                        <div class="arrival">
                            {% if train.minutes_away <= 0 %}
                                NOW
                            {% else %}
                                {{ train.minutes_away }} min
                            {% endif %}
                        </div>
                    </div>
                {% endfor %}
            {% else %}
                <div class="empty">No upcoming trains</div>
            {% endif %}
        </div>
    </div>

    <script>
        const stationSelect = document.getElementById("station-select");
        const directionSelect = document.getElementById("direction-select");

        function navigateToSelection() {
            const params = new URLSearchParams({
                station: stationSelect.value,
                direction: directionSelect.value
            });

            window.location.href = `/compact?${params.toString()}`;
        }

        stationSelect.addEventListener("change", navigateToSelection);
        directionSelect.addEventListener("change", navigateToSelection);

        async function updateTrains() {
            try {
                const params = new URLSearchParams({
                    station: stationSelect.value,
                    direction: directionSelect.value
                });

                const response = await fetch(`/api/compact?${params.toString()}`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const trains = await response.json();
                const container = document.getElementById("trains");

                if (trains.length === 0) {
                    container.innerHTML = `
                        <div class="empty">No upcoming trains</div>
                    `;
                    return;
                }

                container.innerHTML = trains.map(train => {
                    const arrival = train.minutes_away <= 0
                        ? "NOW"
                        : `${train.minutes_away} min`;

                    return `
                        <div class="train">
                            <div class="route">${train.route}</div>
                            <div class="arrival">${arrival}</div>
                        </div>
                    `;
                }).join("");

            } catch (error) {
                console.error("Unable to update trains:", error);
            }
        }

        setInterval(updateTrains, 30000);
    </script>
</body>
</html>
